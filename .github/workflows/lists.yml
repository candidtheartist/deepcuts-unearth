name: Build year-end lists

on:
  schedule:
    - cron: "23 6,18 * * *"   # twice a day: lists come out in a rush in December
  workflow_dispatch:          # lets you run it by hand from the Actions tab
  push:                       # and when the build itself changes
    branches: [main]
    paths:
      - build_lists.py
      - .github/workflows/lists.yml

permissions:
  contents: write

# Shares the feed's queue, so the jobs never push at the same moment.
concurrency:
  group: unearth-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the readers
        run: python3 -m unittest test_build_lists
      - name: Build lists.json
        run: python3 build_lists.py
      - name: Commit if it changed
        run: |
          git config user.name "unearth-bot"
          git config user.email "unearth-bot@users.noreply.github.com"
          git add lists.json lists_memory.json
          git diff --cached --quiet || git commit -m "Update year-end lists"
          git pull --rebase
          git push
