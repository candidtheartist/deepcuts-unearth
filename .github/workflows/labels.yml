name: Build label releases

on:
  schedule:
    - cron: "41 5 * * *"   # once a day
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

# Shares the feed's queue, so the two never push at the same moment.
concurrency:
  group: unearth-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the parsers
        run: python3 -m unittest test_build_labels
      - name: Build labels.json
        run: python3 build_labels.py
      - name: Commit if it changed
        run: |
          git config user.name "unearth-bot"
          git config user.email "unearth-bot@users.noreply.github.com"
          git add labels.json
          git diff --cached --quiet || git commit -m "Update label releases"
          git pull --rebase
          git push
