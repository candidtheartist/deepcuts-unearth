name: Probe a feed
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and parse with the job's own code
        run: |
          python3 - <<'PY'
          import sys, pyexpat, build_feed as b
          print("python", sys.version.split()[0], "expat", pyexpat.EXPAT_VERSION)
          data = b.fetch("https://daily.bandcamp.com/feed")
          print(len(data), "bytes")
          lines = data.split(b"\n")
          for i in range(9, 16):
              print(i + 1, repr(lines[i][:160]))
          try:
              print("parsed", len(list(b.feed_items(data))), "items")
          except Exception as e:
              print("PARSE ERROR", e)
          PY
